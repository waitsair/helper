<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alikusya Racer</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#efe4c8;--panel:#dccaa0;--edge:#8c7650;--gold:#b45f06;--text:#4a3a22;--ok:#8fdc6a;--bad:#f06a55;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:'Press Start 2P',ui-monospace,monospace;font-size:11px;display:flex;justify-content:center;touch-action:manipulation;user-select:none}
#app{width:100%;max-width:420px;display:flex;flex-direction:column;gap:8px;padding:8px}
.bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px;background:var(--panel);border:4px solid var(--edge);padding:8px;line-height:1.5}
#wrap{position:relative;border:4px solid var(--edge);background:#000}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
#ov{position:absolute;inset:0;background:rgba(239,228,200,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:14px;line-height:1.7;overflow-y:auto;justify-content:safe center}
#ov h1{font-size:19px;margin:0;color:var(--gold);text-shadow:3px 3px 0 #f8f1dc;line-height:1.3}
#ov p{margin:0}
input{font:inherit;color:var(--text);background:#f8f1dc;border:4px solid var(--edge);padding:8px;text-align:center;width:210px;max-width:100%}
input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button{font:inherit;color:var(--text);background:#cdb98a;border:4px solid var(--edge);box-shadow:inset -4px -4px 0 #a89468,inset 4px 4px 0 #e6d7ae;padding:10px 12px;cursor:pointer}
button:hover{background:#d8c698}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button.go{background:#8fcf62;box-shadow:inset -4px -4px 0 #5fa23a,inset 4px 4px 0 #b8e592;font-size:14px;padding:14px 20px}
.row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.row button{padding:7px 8px}
.row button.on{background:#e0a040;box-shadow:inset -4px -4px 0 #b87a1c,inset 4px 4px 0 #f2c878}
#quiz{background:var(--panel);border:4px solid var(--edge);padding:10px;text-align:center}
#q{font-size:20px;color:var(--gold);margin-bottom:10px;min-height:28px}
#opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#opts button{font-size:17px;padding:16px 4px}
#opts button.ok{background:var(--ok)}
#opts button.bad{background:var(--bad)}
#hint{margin-top:8px;font-size:9px;opacity:.85;line-height:1.6;min-height:14px}
</style>
</head>
<body>
<div id="app">
  <div class="bar"><span id="lpos"></span><span id="lsolve"></span><div class="row"><span class="row" id="langs"></span><button id="mute" aria-label="sound">🔊</button></div></div>
  <div id="wrap">
    <canvas id="c" width="320" height="400"></canvas>
    <div id="ov"></div>
  </div>
  <div id="quiz">
    <div id="q"></div>
    <div id="opts"></div>
    <div id="hint"></div>
  </div>
</div>

function audioInit(){
  if(AC){if(AC.state==='suspended')AC.resume();return}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    engs={};
    ['y','o','r'].forEach(k=>{
      const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=400;
      const a=AC.createOscillator(),b=AC.createOscillator();a.type='sawtooth';b.type='triangle';a.frequency.value=40;b.frequency.value=60;
      const g=AC.createGain();g.gain.value=0;
      const pan=AC.createStereoPanner?AC.createStereoPanner():null;
      if(pan)pan.pan.value=k==='r'?-.6:k==='o'?.6:0;
      a.connect(lp);b.connect(lp);lp.connect(g);
      if(pan){g.connect(pan);pan.connect(AC.destination)}else g.connect(AC.destination);
      a.start();b.start();engs[k]={a,b,g,lp};
    });
  }catch(e){AC=null;engs=null}
}
function engUpdate(){
  if(!AC||!engs)return;
  const on=!muted&&(st==='count'||st==='race'),now=AC.currentTime;
  ['y','o','r'].forEach(k=>{
    const e=engs[k],c=cars&&cars[k],v=on&&c?c.v:0;
    const f=38+v*16,g=on?(k==='y'?.07:.025)*(.45+v/6):0;
    e.a.frequency.setTargetAtTime(f,now,.05);e.b.frequency.setTargetAtTime(f*1.5,now,.05);
    e.lp.frequency.setTargetAtTime(300+v*120,now,.05);e.g.gain.setTargetAtTime(g,now,.08);
  });
}
function beep(f,d,type,vol,when,to){
  if(!AC||muted)return;
  const t0=AC.currentTime+(when||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t0);
  if(to)o.frequency.exponentialRampToValueAtTime(to,t0+d);
  g.gain.setValueAtTime(vol||.1,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);
  o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d+.02);
}

  locked=true;
  const box=document.getElementById('opts'),bt=box.children[i];
  if(qa.opts[i]===qa.r){bt.classList.add('ok');solved++;sndOk();cars.y.v=Math.min(8,cars.y.v+3);setTimeout(()=>{if(st==='race')newQ()},350)}
  else{bt.classList.add('bad');errs++;sndBad();cars.y.v*=.3;shake=10;
    [...box.children].forEach(b=>{if(+b.dataset.v===qa.r)b.classList.add('ok')});
    setTimeout(()=>{if(st==='race')newQ()},900)}
  updateHud();
}
function step(){
  frame++;
  if(st==='count'){if((frame-1)%70===0&&frame<210)sndCount();if(frame>=210){st='race';frame=0;startT=performance.now();msg=t('go');msgT=50;sndGo()}return}
  if(st==='race'){
    
    const pb=place();
    for(const k of ['o','r']){const c=cars[k];if(--c.t<=0){c.v=Math.min(8,c.v+3);const g=GAP[diff];c.t=g[0]+Math.random()*(g[1]-g[0])}}
    
    for(const k of ['y','o','r']){const c=cars[k];c.v*=.986;if(c.v<.02)c.v=0;c.d+=c.v;if(!c.fin&&c.d>=L){c.d=L;c.fin=1;c.v=0;if(k==='y')c.rank=1+['o','r'].filter(j=>cars[j].fin).length}}
    if(place()<pb){msg=t('pass');msgT=60;sndPass()}
    updateHud();
    if(cars.y.fin)finishRace();
  }
  if(msgT>0)msgT--;if(shake>0)shake--;
}
function finishRace(){
  if(st!=='race')return;st='over';tf=(performance.now()-startT)/1000;cars.y.rank===1?sndWin():sndLose();
  
  showMenu(true);
}
function px(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function tree(x,y,s){px(x+12,y+24,8,18,'#6b4423');px(x+2,y+4,28,24,s?'#2f8f2f':'#3aa83a');px(x+8,y-6,16,12,s?'#2f8f2f':'#3aa83a');px(x+6,y+8,6,6,'#59c459');px(x+20,y+16,6,6,'#59c459')}
function car(k,cx,cy){
  const im=sprites[k],h=sh(k);
  if(im)ctx.drawImage(im,cx-SW/2,cy-h/2,SW,h);
  else{px(cx-30,cy-6,60,24,COL[k]);px(cx-26,cy+16,14,10,'#000');px(cx+12,cy+16,14,10,'#000');px(cx-12,cy-26,24,22,'#a07040')}
}
function draw(){
  ctx.imageSmoothingEnabled=false;
  const dp=cars?cars.y.d:0;
  ctx.save();if(shake)ctx.translate((Math.random()-.5)*6,0);
  const sc=((dp%40)+40)%40;
  for(let y=-40+sc;y<H+20;y+=20)for(let x=0;x<W;x+=20){px(x,y,20,20,(((x+y-sc)/20)&1)?'#4ca93f':'#55b548')}
  px(ROAD_X-8,0,8,H,'#8a6a3a');px(ROAD_X+LANE*3,0,8,H,'#8a6a3a');
  px(ROAD_X,0,LANE*3,H,'#6e6e78');
  for(let y=-40+sc;y<H;y+=40){px(ROAD_X+LANE-3,y,6,22,'#f5f0c8');px(ROAD_X+LANE*2-3,y,6,22,'#f5f0c8')}
  for(let i=0;i<12;i++){const wy=((i*70-dp)%840+840)%840-40;tree(i%2?W-34:2,wy,i%3===0)}
  // start and finish lines
  const lineY=d=>PY-(d-dp);
  const fy=lineY(L);
  if(fy>-30&&fy<H+30)for(let i=0;i<12;i++)for(let j=0;j<2;j++)px(ROAD_X+i*20,fy-10+j*10,20,10,(i+j)%2?'#fff':'#111');
  const sy=lineY(0);
  if(sy>-20&&sy<H+20)px(ROAD_X,sy,LANE*3,6,'#fff');
  if(cars){
    ['r','o','y'].forEach(k=>{const c=cars[k],cy=k==='y'?PY:lineY(c.d);if(cy>-60&&cy<H+60){
      if(k==='y'&&cars.y.v>5)ctx.globalAlpha=.3,car(k,laneX(1),cy+14),ctx.globalAlpha=1;
      car(k,laneX(c.lane),cy);label(k==='y'?myName():c.name,laneX(c.lane),cy-sh(k)/2-4,k==='y'?'#fff200':'#fff')}});
  }
  // progress bar
  px(0,0,W,16,'rgba(0,0,0,.45)');
  ['r','o','y'].forEach(k=>{const x=8+(W-16)*(cars?cars[k].d/L:0);px(x-4,3,8,10,COL[k]);px(x-4,3,8,1,'#000')});
  px(W-9,0,2,16,'#fff');
  if(st==='count'){const n=3-Math.floor(frame/70);if(n>0){ctx.font='40px "Press Start 2P",monospace';ctx.textAlign='center';ctx.fillStyle='#000';ctx.fillText(n,W/2+3,203);ctx.fillStyle='#fff200';ctx.fillText(n,W/2,200)}}
  if(msgT>0){ctx.font='16px "Press Start 2P",monospace';ctx.textAlign='center';ctx.fillStyle='#000';ctx.fillText(msg,W/2+2,102);ctx.fillStyle='#fff200';ctx.fillText(msg,W/2,100)}
  ctx.restore();
}
let lastT=0,acc=0;
function loop(ts){
  if(!lastT)lastT=ts;acc+=Math.min(100,ts-lastT);lastT=ts;
  while(acc>=1000/60){if(st==='count'||st==='race')step();acc-=1000/60}
  draw();engUpdate();requestAnimationFrame(loop)}
function chips(items,cur,fn){return items.map((n,i)=>'<button data-i="'+i+'"'+(i===cur?' class="on"':'')+'>'+n+'</button>').join('')}
function showMenu(over){
  const ov=document.getElementById('ov');ov.style.display='flex';
  let body;
  if(over){
    const p=cars.y.rank||3;
    const order=['o','r'].sort((a,b)=>cars[b].d-cars[a].d);order.splice(p-1,0,'y');
    const list=order.map((k,i)=>(i+1)+'. '+esc(k==='y'?myName():cars[k].name)).join('<br>');
    body='<h1>'+(p===1?t('win'):p===2?t('p2'):t('p3'))+'</h1><p>'+list+'<br><br>'+t('time')+': '+tf.toFixed(1)+' s<br>'+t('solved')+': '+solved+' · '+t('err')+': '+errs+'</p>';
  }else body='<h1>'+t('title')+'</h1><p>'+t('sub')+'</p>';
  ov.innerHTML=body+'<p>'+t('nick')+'</p><input id="nick" maxlength="16" autocomplete="off" spellcheck="false"><p>'+t('diff')+'</p><div class="row" id="dd">'+chips([t('easy'),t('normal'),t('hard')],diff)+'</div>'+
    '<p>'+t('tbl')+'</p><div class="row" id="tt">'+chips(['×2-9',2,3,4,5,6,7,8,9].map(String),tbl?tbl-1:0)+'</div>'+
    '<button class="go" id="go">'+(over?t('again'):t('start'))+'</button>';
  document.querySelectorAll('#dd button').forEach(b=>b.onclick=()=>{diff=+b.dataset.i;try{localStorage.setItem('alik_diff',diff)}catch(e){}showMenu(over)});
  document.querySelectorAll('#tt button').forEach(b=>b.onclick=()=>{tbl=+b.dataset.i?+b.dataset.i+1:0;showMenu(over)});
  document.getElementById('go').onclick=start;
  const ni=document.getElementById('nick');ni.value=nick;ni.oninput=()=>{nick=ni.value.trim().slice(0,16);try{localStorage.setItem('alik_nick',nick)}catch(e){}};
}
function start(){audioInit();reset();st='count';frame=0;document.getElementById('ov').style.display='none'}
function buildLangs(){
  const box=document.getElementById('langs');box.innerHTML='';
  [['en','EN'],['uk','UA'],['ru','RU']].forEach(([k,l])=>{
    const b=document.createElement('button');b.textContent=l;if(k===lang)b.className='on';
    b.onclick=()=>{lang=k;try{localStorage.setItem('alik_lang',k)}catch(e){}
      document.documentElement.lang=k;document.title=t('title');buildLangs();
      document.getElementById('hint').textContent=t('hint');updateHud();
      if(st==='menu')showMenu();else if(st==='over')showMenu(true)};
    box.appendChild(b)});
}
addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT')return;
  if(['1','2','3'].includes(e.key))answer(+e.key-1);
  if((e.key==='Enter'||e.key===' ')&&(st==='menu'||st==='over')&&loaded===3){e.preventDefault();start()}
});
document.documentElement.lang=lang;document.title=t('title');
reset();st='menu';buildLangs();
requestAnimationFrame(loop);
</script>
</body>
